services:
  postgres:
    image: postgres:16
    container_name: dishtansya-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dishtansya-redis
    command: redis-server --requirepass ${REDIS_PASS}
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  mailpit:
    image: axllent/mailpit
    container_name: dishtansya-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
